      .card { fill: #ffffff; stroke: #d9d2c7; stroke-width: 1.5; rx: 12; }
      .field { fill: #fffdf9; stroke: #d8d0c2; stroke-width: 1.2; rx: 8; }
      .primary { fill: #201d1a; }
      .button { fill: #ffffff; stroke: #d9d2c7; stroke-width: 1.3; rx: 6; }
      .title { font: 700 28px "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif; fill: #2e2a25; }
      .subtitle { font: 500 15px "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif; fill: #7f7669; }
      .small { font: 600 14px "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif; fill: #1f1a17; }
      .muted { font: 500 13px "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif; fill: #7f7669; }
      .label { font: 600 13px "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif; fill: #6f665a; }
      .value { font: 600 15px "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif; fill: #2e2a25; }
      .invoiceTitle { font: 800 30px "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif; fill: #a24a14; letter-spacing: 1px; }
      .invoiceSmall { font: 600 12px "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif; fill: #a24a14; }
      .invoiceText { font: 500 12px "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif; fill: #7c5c3d; }
