<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860">
  <defs>
    <style>
      .bg { fill: #f4f1ea; }
      .panel { fill: #ffffff; stroke: #ddd4c8; stroke-width: 1.5; rx: 18; }
      .card { fill: #ffffff; stroke: #d9d2c7; stroke-width: 1.5; rx: 14; }
      .button { fill: #ffffff; stroke: #d9d2c7; stroke-width: 1.3; rx: 6; }
      .primary { fill: #201d1a; }
      .title { font: 800 34px "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif; fill: #2e2a25; }
      .subtitle { font: 500 16px "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif; fill: #7f7669; }
      .small { font: 600 14px "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif; fill: #1f1a17; }
      .muted { font: 500 13px "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif; fill: #7f7669; }
      .warn { font: 700 74px "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif; fill: #a24a14; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1440" height="860"/>
  <rect x="96" y="96" width="1248" height="668" class="panel"/>

  <rect x="486" y="168" width="468" height="524" class="card"/>
  <text class="warn" x="642" y="298">!</text>
  <text class="title" x="560" y="354">アクセス権限がありません</text>
  <text class="subtitle" x="560" y="388">この画面の閲覧には権限が必要です。</text>
  <text class="subtitle" x="560" y="418">権限のあるアカウントで再度ログインしてください。</text>

  <rect x="560" y="462" width="320" height="96" fill="#fffaf4" stroke="#eadccc"/>
  <text class="small" x="584" y="496">想定される権限</text>
  <text class="muted" x="584" y="524">viewer / operator / admin</text>
  <text class="muted" x="584" y="548">Cognito グループを確認してください。</text>

  <rect class="button" x="560" y="588" width="148" height="44"/>
  <text class="small" x="602" y="616">一覧に戻る</text>
  <rect class="primary" x="724" y="588" width="156" height="44" rx="6"/>
  <text class="small" x="770" y="616" fill="#ffffff">ログアウト</text>

  <text class="muted" x="570" y="680">権限不足は `/forbidden` で案内します。</text>
</svg>
