<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860">
  <defs>
    <style>
      .bg { fill: #f6f4ef; }
      .card { fill: #ffffff; stroke: #d9d2c7; stroke-width: 1.5; rx: 14; }
      .title { font: 700 30px "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif; fill: #2e2a25; }
      .subtitle { font: 500 15px "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif; fill: #7f7669; }
      .small { font: 600 14px "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif; fill: #1f1a17; }
      .muted { font: 500 13px "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif; fill: #7f7669; }
      .panel { fill: #fcfaf6; stroke: #e4ddd2; stroke-width: 1.2; }
      .thumbTitle { font: 700 16px "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif; fill: #2e2a25; }
      .thumbText { font: 500 11px "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif; fill: #7c7265; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1440" height="860"/>
  <text class="title" x="56" y="64">画面モック集</text>
  <text class="subtitle" x="56" y="92">個別画面のイメージを 1440px 幅で揃えた一覧です。</text>

  <g transform="translate(56,126)">
