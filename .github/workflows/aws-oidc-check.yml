name: AWS OIDC Check

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Target stage
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod

jobs:
  auth-dev:
    if: ${{ github.event.inputs.stage == 'dev' }}
    environment: dev
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-northeast-1
          role-session-name: github-actions-oidc-dev
          role-to-assume: ${{ vars.AWS_ROLE_ARN_DEV }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

  auth-prod:
    if: ${{ github.event.inputs.stage == 'prod' }}
    environment: prod
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-northeast-1
          role-session-name: github-actions-oidc-prod
          role-to-assume: ${{ vars.AWS_ROLE_ARN_PROD }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity
