name: Frontend Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      stage:
        description: Deploy target stage
        required: true
        type: choice
        options:
          - dev
          - prod
        default: dev

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/order-management-system-frontend

jobs:
  deploy-dev:
    if: github.event_name == 'push' || github.event.inputs.stage == 'dev'
    name: deploy-dev
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: frontend-deploy-dev
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate environment variables
        run: |
          if [ -z "${NEXT_PUBLIC_API_BASE_URL}" ]; then
            echo "NEXT_PUBLIC_API_BASE_URL is required for frontend deployment."
            exit 1
          fi
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          tags: |
            ${{ env.IMAGE_NAME }}:dev-${{ github.sha }}
            ${{ env.IMAGE_NAME }}:dev-latest

  deploy-prod:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.stage == 'prod'
    name: deploy-prod
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: frontend-deploy-prod
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate environment variables
        run: |
          if [ -z "${NEXT_PUBLIC_API_BASE_URL}" ]; then
            echo "NEXT_PUBLIC_API_BASE_URL is required for frontend deployment."
            exit 1
          fi
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          tags: |
            ${{ env.IMAGE_NAME }}:prod-${{ github.sha }}
            ${{ env.IMAGE_NAME }}:prod-latest
